# Source template for the legacy, explicitly selected local publication mode.
name: Publish EagleEye snapshot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ vars.EAGLEEYE_CLOUD_ENABLED != 'true' && github.repository == 'musiclord/EagleEye' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check exported snapshot and reject cloud-managed repository
        shell: bash
        run: |
          set -euo pipefail
          test ! -d cloud-data
          test ! -f .github/workflows/cloud-daily.yml
          test -f site/index.html
          test -f site/snapshot/manifest.json
          test -f site/.nojekyll
      - name: Reject an obsolete deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (branch.commit.sha !== context.sha) throw new Error('Remote main changed; do not deploy an obsolete snapshot');
      - uses: actions/configure-pages@v5
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
